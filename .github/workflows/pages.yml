name: deploy-pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'icons.js'
      - 'town.js'
      - 'CNAME'
      - 'scripts/validate.cjs'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site (app, icons and town engine)
        run: |
          mkdir -p _site
          cp index.html icons.js town.js _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
